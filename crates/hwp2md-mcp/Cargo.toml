[package]
name = "hwp2md-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "MCP server for hwp2md: lets Claude and other MCP clients read HWPX documents as Markdown"
repository = "https://github.com/hephaex/hwp2md"
keywords = ["hwpx", "hangul", "markdown", "mcp"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "hwp2md-mcp"
path = "src/main.rs"

[dependencies]
hwp2md = { path = "../..", version = "0.5.0" }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "time"] }
zip = { version = "2.0", default-features = false, features = ["deflate"] }
